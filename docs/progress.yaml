  items:
    - {t: "Session Q&A document with corrected answers", done: false}
    - {t: "Guided code tour (supervisor's directive)", done: false}
    - {t: "Unified master study document", done: false}
    - {t: "Present the updated system to the supervisor; incorporate feedback", done: false}
    - {t: "Full illustrated manual (final step before submission)", done: false}
