# Research Progress checklist — the app computes completion % from these items.
# Edit freely: set done: true/false, or done: auto:<key> to bind an item to the
# live system state (resolved by backend/research/progress.py).
# Chapter titles verified verbatim against the final thesis v13 (CGS format).
front_matter:
  title: "Front matter"
  items:
    - {t: "Title page & declaration (approved wording)", done: true}
    - {t: "Abstract (EN)", done: true}
    - {t: "Abstract (AR) — approved verbatim", done: true}
    - {t: "Dedication, acknowledgements, ToC & list of tables", done: true}
    - {t: "List of figures (15 figures; 8 produced by the system's Exports)", done: "auto:exports"}
ch1:
  title: "Chapter 1 — Introduction"
  items:
    - {t: "Background, problem statement, objectives, questions", done: true}
    - {t: "Scope, significance & thesis structure", done: true}
    - {t: "Final pass for CGS thesis format (v13)", done: true}
ch2:
  title: "Chapter 2 — Background and Literature"
  items:
    - {t: "7 distinct core papers reviewed (refs 04,12,13,14,15,16,17)", done: true}
    - {t: "All 17 references completed & verified", done: true}
    - {t: "Synthesis matrix (Tables 2.1/2.2), research gap & hypothesis", done: true}
ch3:
  title: "Chapter 3 — Methodology"
  items:
    - {t: "Real dataset documented (176 records, anonymization, labels)", done: true}
    - {t: "Leakage boundary & PRE-EXEC/FULL feature sets", done: true}
    - {t: "Grouped validation design (StratifiedGroupKFold 5×5)", done: true}
    - {t: "Imbalance handling decision (class_weight, F4)", done: true}
    - {t: "Methodology figures 3.1–3.4 in the final text", done: true}
ch4:
  title: "Chapter 4 — Analysis & Design"
  items:
    - {t: "Overall architecture & data layer design", done: true}
    - {t: "Experiment & evaluation design (grouped CV, sealed-vault protocol)", done: true}
    - {t: "Recommendation engine design (rulebook R1–R8)", done: "auto:rules"}
    - {t: "Serving models registry & artifacts", done: "auto:models"}
    - {t: "Integrity & reproducibility measures", done: true}
ch5:
  title: "Chapter 5 — Results & Discussion"
  items:
    - {t: "Baseline grouped-CV results (real data)", done: "auto:baseline"}
    - {t: "Nested tuning & official winner declaration", done: "auto:winner"}
    - {t: "Explainability (coefficients, permutation, per-case)", done: "auto:xai"}
    - {t: "Chapter-5 figures & tables exported from the system", done: "auto:exports"}
    - {t: "Robustness checks: seed sensitivity & 11-feature sensitivity", done: true}
    - {t: "Sealed 20% holdout — final judgment (18 services / 36 records, Macro-F1 0.559)", done: true}
    - {t: "Discussion & threats to validity (§5.11)", done: true}
ch6:
  title: "Chapter 6 — Summary & Recommendations"
  items:
    - {t: "Conclusions mapped to research questions", done: true}
    - {t: "Contributions, recommendations & future work", done: true}
supervisor:
  title: "Proposal & supervisor deliverables"
  items:
    - {t: "MSc proposal v11 (approved baseline: clean supervisor copy + highlighted draft)", done: true}
    - {t: "Weekly package: dataset in two versions with influence evidence", done: true}
    - {t: "Weekly package: algorithms explained (simple Arabic + detailed English)", done: true}
    - {t: "Live terminal demo script (algorithm_walkthrough)", done: true}
    - {t: "Algorithms presentations (AR/EN, 15 slides, Arabic speaker notes)", done: true}
    - {t: "Media kit: teaser + UI tour (AR/EN) — teaser delivered to supervisor", done: true}
    - {t: "Session package: printable guide + 13 expected Q&A", done: true}
    - {t: "Supervisor system session held; feedback incorporated (UI upgrade)", done: true}
practical:
  title: "Practical system (defense build)"
  items:
    - {t: "Arabic/English UI + dark/light (build 3C)", done: "auto:ui"}
    - {t: "Docker packaging", done: "auto:docker"}
    - {t: "Demo/Live mode, locked holdout & presentation flow (Phase 5)", done: "auto:holdout"}
    - {t: "Final verification checklist (Phase 6, 21-test suite)", done: true}
